services:
  - type: web
    name: visioniq-backend
    runtime: python
    rootDir: backend

    # Step 1: install deps
    # Step 2: install facenet-pytorch without its stale Pillow constraint
    # Step 3: pre-download all model weights into /tmp/hf_cache at BUILD time
    #         so the server starts instantly with no OOM risk at runtime
    buildCommand: >
      pip install -r requirements.txt &&
      pip install "facenet-pytorch==2.6.0" --no-deps &&
      python download_models.py

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/src/.hf_cache
      - key: TORCH_HOME
        value: /opt/render/project/src/.hf_cache
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
