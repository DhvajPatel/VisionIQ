services:
  - type: web
    name: visioniq-backend
    runtime: python
    rootDir: backend

    # Render Python 3.11 — install CPU-only torch explicitly before requirements.txt
    # so the flexible >= pins in requirements.txt resolve to the CPU wheel
    buildCommand: >
      pip install --extra-index-url https://download.pytorch.org/whl/cpu
      "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" &&
      pip install -r requirements.txt &&
      pip install "facenet-pytorch==2.6.0" --no-deps &&
      python download_models.py

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/src/.hf_cache
      - key: TORCH_HOME
        value: /opt/render/project/src/.hf_cache
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
