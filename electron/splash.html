<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionIQ — Starting…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px; height: 300px;
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border-radius: 16px;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Glowing background orb */
    body::before {
      content: "";
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .icon-ring {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 32px rgba(139,92,246,0.5);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .icon-ring img {
      width: 52px; height: 52px;
      border-radius: 12px;
      object-fit: cover;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 24px rgba(139,92,246,0.4); }
      50%       { box-shadow: 0 0 40px rgba(139,92,246,0.8); }
    }

    .app-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 320px;
    }

    .status-text {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    /* Animated loading bar */
    .progress-track {
      width: 100%;
      height: 3px;
      background: #1e1e2e;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #06b6d4);
      border-radius: 99px;
      animation: indeterminate 1.8s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0%   { transform: translateX(-100%) scaleX(0.4); }
      50%  { transform: translateX(0%)    scaleX(0.6); }
      100% { transform: translateX(100%)  scaleX(0.4); }
    }

    .dots {
      display: flex; gap: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      background: #8b5cf6;
      border-radius: 50%;
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #7c3aed; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #06b6d4; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1.0; }
    }

    .version {
      position: absolute;
      bottom: 12px;
      font-size: 10px;
      color: #334155;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="icon-ring">
      <img src="../frontend/public/icon.ico" onerror="this.style.display='none'" alt="VisionIQ" />
    </div>
    <div class="app-name">VisionIQ</div>
    <div class="tagline">AI Vision · Desktop Edition</div>
  </div>

  <div class="status-area">
    <div class="status-text" id="status">Starting AI backend…</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="version">v2.1.0</div>

  <script>
    if (typeof require !== "undefined") {
      const { ipcRenderer } = require("electron");

      // "set-status" — direct status text from backend stdout
      ipcRenderer.on("set-status", (_, { msg, color }) => {
        const el = document.getElementById("status");
        el.textContent = msg;
        if (color) el.style.color = color;
      });

      // "backend-status" — from health check JSON
      ipcRenderer.on("backend-status", (_, data) => {
        const el = document.getElementById("status");
        if (data.models_loaded) {
          el.textContent = "Models ready — launching…";
          el.style.color = "#22c55e";
        } else if (data.status === "ok") {
          el.textContent = "Backend running — loading AI models…";
        } else {
          el.textContent = "Waiting for backend…";
        }
      });
    }
  </script>
</body>
</html>
