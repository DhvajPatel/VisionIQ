# electron-builder configuration for VisionIQ
# Run from: frontend/  via  npm run electron:build
# Output:   dist-electron/  (NSIS installer .exe)

appId:       com.visioniq.app
productName: VisionIQ
copyright:   "© 2025 VisionIQ"

# Entry point: the Electron main process
directories:
  buildResources: "../electron/assets"
  output:         "../dist-electron"

# Main process entry (relative to frontend/)
main: "../electron/main.js"

# Files to include in the packaged app
files:
  - "../electron/main.js"
  - "../electron/preload.js"
  - "../electron/splash.html"
  - "dist/**/*"
  - "public/icon.ico"

# Extra resources bundled OUTSIDE the asar (accessible at process.resourcesPath)
extraResources:
  # Bundled Python backend (built by PyInstaller)
  - from: "../backend/dist/visioniq_server"
    to:   "backend"
    filter:
      - "**/*"
  # Frontend dist
  - from: "dist"
    to:   "frontend/dist"
    filter:
      - "**/*"

# Windows NSIS installer — must use .ico
win:
  target:
    - target: nsis
      arch:   [x64]
  icon: "../frontend/public/icon.ico"

nsis:
  oneClick:              false
  allowToChangeInstallationDirectory: true
  installerIcon:         "../frontend/public/icon.ico"
  uninstallerIcon:       "../frontend/public/icon.ico"
  installerHeaderIcon:   "../frontend/public/icon.ico"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName:          "VisionIQ"
  license:               "../LICENSE.txt"
  runAfterFinish:        true

# Mac
mac:
  target: dmg
  icon:   "../frontend/public/icon.ico"

# Linux
linux:
  target: AppImage
  icon:   "../frontend/public/icon.ico"
